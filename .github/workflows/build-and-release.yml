name: Build and Release ChronoKeep

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      component:
        description: 'Componente a compilar e publicar'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'daemon'
          - 'bridge'
          - 'gui'
      tag_name:
        description: 'Tag de destino no GitHub Release (ex: v0.2.0 ou latest)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-manifest
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows Release Binaries
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Core Daemon & Bridge DLL
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.component == 'daemon' || inputs.component == 'bridge' || inputs.component == 'gui' }}
        shell: pwsh
        run: |
          $comp = "${{ inputs.component }}"
          if ($comp -eq "daemon") {
            cargo build --manifest-path rust-workspace/Cargo.toml --release -p cr-service
          } elseif ($comp -eq "bridge") {
            cargo build --manifest-path rust-workspace/Cargo.toml --release -p cr-bridge-dll
          } else {
            cargo build --manifest-path rust-workspace/Cargo.toml --release -p cr-service -p cr-bridge-dll
          }

      - name: Update Embedded Binaries for Installer
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.component == 'gui' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rust-workspace/crates/cr-gui/embedded
          $binDir = if (Test-Path "rust-workspace/target/release/chrono-daemon.exe") { "rust-workspace/target/release" } else { "rust-workspace/target/x86_64-pc-windows-msvc/release" }
          if (Test-Path "$binDir/chrono-daemon.exe") {
            Copy-Item -Force "$binDir/chrono-daemon.exe" rust-workspace/crates/cr-gui/embedded/
          }
          if (Test-Path "$binDir/chronokeep.dll") {
            Copy-Item -Force "$binDir/chronokeep.dll" rust-workspace/crates/cr-gui/embedded/
          }
          if (Test-Path dist/chronokeep.ini) {
            Copy-Item -Force dist/chronokeep.ini rust-workspace/crates/cr-gui/embedded/
          }

      - name: Build ChronoKeep Desktop App (ChronoKeep.exe)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.component == 'gui' }}
        shell: pwsh
        run: |
          cd rust-workspace
          cargo build --release -p cr-gui
          cd ..

      - name: Assemble Release Assets & Generate versions.json
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          $binDir = if (Test-Path "rust-workspace/target/release/ChronoKeep.exe") { "rust-workspace/target/release" } else { "rust-workspace/target/x86_64-pc-windows-msvc/release" }
          
          $comp = "${{ inputs.component }}"
          if ($comp -eq "daemon") {
            if (Test-Path "$binDir/chrono-daemon.exe") { Copy-Item -Force "$binDir/chrono-daemon.exe" release-artifacts/ }
          } elseif ($comp -eq "bridge") {
            if (Test-Path "$binDir/chronokeep.dll") {
              Copy-Item -Force "$binDir/chronokeep.dll" release-artifacts/
              Copy-Item -Force "$binDir/chronokeep.dll" release-artifacts/cloud_redirect.dll
            }
          } elseif ($comp -eq "gui") {
            if (Test-Path "$binDir/ChronoKeep.exe") { Copy-Item -Force "$binDir/ChronoKeep.exe" release-artifacts/ }
          } else {
            if (Test-Path "$binDir/ChronoKeep.exe") { Copy-Item -Force "$binDir/ChronoKeep.exe" release-artifacts/ }
            if (Test-Path "$binDir/chrono-daemon.exe") { Copy-Item -Force "$binDir/chrono-daemon.exe" release-artifacts/ }
            if (Test-Path "$binDir/chronokeep.dll") {
              Copy-Item -Force "$binDir/chronokeep.dll" release-artifacts/
              Copy-Item -Force "$binDir/chronokeep.dll" release-artifacts/cloud_redirect.dll
            }
          }

          # Calcula hashes SHA256 para os componentes gerados nesta execucao
          $hashes = @{}
          if (Test-Path "release-artifacts/ChronoKeep.exe") {
            $hashes["gui"] = (Get-FileHash -Algorithm SHA256 "release-artifacts/ChronoKeep.exe").Hash.ToLower()
          }
          if (Test-Path "release-artifacts/chrono-daemon.exe") {
            $hashes["daemon"] = (Get-FileHash -Algorithm SHA256 "release-artifacts/chrono-daemon.exe").Hash.ToLower()
          }
          if (Test-Path "release-artifacts/chronokeep.dll") {
            $hashes["bridge"] = (Get-FileHash -Algorithm SHA256 "release-artifacts/chronokeep.dll").Hash.ToLower()
          }

          # Obtem versao semantica do Cargo.toml para nunca usar "latest" no manifesto
          $cargoToml = Get-Content "rust-workspace/crates/cr-gui/Cargo.toml" -Raw
          $pkgVer = if ($cargoToml -match 'version\s*=\s*"([^"]+)"') { "v$($matches[1])" } else { "v0.1.5" }

          $verTag = if ("${{ inputs.tag_name }}" -ne "" -and "${{ inputs.tag_name }}" -ne "latest") {
            "${{ inputs.tag_name }}"
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF_NAME
          } else {
            $pkgVer
          }

          # Carrega versions.json existente se houver para preservar componentes nao reconstruidos
          $manifestObj = $null
          if (Test-Path "versions.json") {
            try {
              $manifestObj = Get-Content -Raw "versions.json" | ConvertFrom-Json
            } catch {
              $manifestObj = $null
            }
          }

          if ($null -eq $manifestObj) {
            $manifestObj = [PSCustomObject]@{
              release_version = $verTag
              published_at = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
              components = [PSCustomObject]@{}
            }
          } else {
            $manifestObj.release_version = $verTag
            $manifestObj.published_at = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            if ($null -eq $manifestObj.components) {
              $manifestObj | Add-Member -NotePropertyName "components" -NotePropertyValue ([PSCustomObject]@{}) -Force
            }
          }

          if (Test-Path "release-artifacts/ChronoKeep.exe") {
            $guiObj = [PSCustomObject]@{
              version = $verTag
              filename = "ChronoKeep.exe"
              sha256 = $hashes["gui"]
              download_url = "https://github.com/leufrasiojunior/ChronoKeep/releases/download/$verTag/ChronoKeep.exe"
            }
            $manifestObj.components | Add-Member -NotePropertyName "gui" -NotePropertyValue $guiObj -Force
          }
          if (Test-Path "release-artifacts/chrono-daemon.exe") {
            $daemonObj = [PSCustomObject]@{
              version = $verTag
              filename = "chrono-daemon.exe"
              sha256 = $hashes["daemon"]
              download_url = "https://github.com/leufrasiojunior/ChronoKeep/releases/download/$verTag/chrono-daemon.exe"
            }
            $manifestObj.components | Add-Member -NotePropertyName "daemon" -NotePropertyValue $daemonObj -Force
          }
          if (Test-Path "release-artifacts/chronokeep.dll") {
            $bridgeObj = [PSCustomObject]@{
              version = $verTag
              filename = "chronokeep.dll"
              sha256 = $hashes["bridge"]
              download_url = "https://github.com/leufrasiojunior/ChronoKeep/releases/download/$verTag/chronokeep.dll"
            }
            $manifestObj.components | Add-Member -NotePropertyName "bridge_dll" -NotePropertyValue $bridgeObj -Force
          }

          # Salva versions.json na raiz do repositorio (para servir via raw content)
          $manifestObj | ConvertTo-Json -Depth 5 | Set-Content -Path "versions.json" -Encoding UTF8

          # Monta pasta temporaria para gerar o pacote ZIP completo
          New-Item -ItemType Directory -Force -Path temp-zip
          Copy-Item -Force release-artifacts/* temp-zip/
          if (Test-Path dist/chronokeep.ini) { Copy-Item -Force dist/chronokeep.ini temp-zip/ }
          if (Test-Path dist/Reparar_Instalacao_Steam.bat) { Copy-Item -Force dist/Reparar_Instalacao_Steam.bat temp-zip/ }
          if (Test-Path README.md) { Copy-Item -Force README.md temp-zip/ }
          if (Test-Path GUIA_GOOGLE_CLOUD_OAUTH.md) { Copy-Item -Force GUIA_GOOGLE_CLOUD_OAUTH.md temp-zip/ }

          # Cria o arquivo ZIP completo se todos os binarios estiverem presentes
          if ((Test-Path "release-artifacts/ChronoKeep.exe") -and (Test-Path "release-artifacts/chrono-daemon.exe") -and (Test-Path "release-artifacts/chronokeep.dll")) {
            Compress-Archive -Path temp-zip/* -DestinationPath ChronoKeep-Windows-x64.zip -Force
          }
          Remove-Item -Recurse -Force temp-zip

          Get-ChildItem -Path release-artifacts

      - name: Upload Build Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ChronoKeep-Windows-x64
          path: release-artifacts/*

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $cargoToml = Get-Content "rust-workspace/crates/cr-gui/Cargo.toml" -Raw
          $pkgVer = if ($cargoToml -match 'version\s*=\s*"([^"]+)"') { "v$($matches[1])" } else { "v0.1.5" }

          $tagName = if ("${{ inputs.tag_name }}" -ne "" -and "${{ inputs.tag_name }}" -ne "latest") {
            "${{ inputs.tag_name }}"
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF_NAME
          } else {
            $pkgVer
          }

          $relTitle = if ($tagName -like "v*") { "ChronoKeep $tagName" } else { "ChronoKeep Latest Build" }

          $assetsToUpload = Get-ChildItem -Path release-artifacts/* | ForEach-Object { $_.FullName }
          if (Test-Path "ChronoKeep-Windows-x64.zip") {
            $assetsToUpload += (Get-Item "ChronoKeep-Windows-x64.zip").FullName
          }

          $null = gh release view $tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tagName @assetsToUpload --clobber
          } else {
            gh release create $tagName @assetsToUpload --title $relTitle --notes "ChronoKeep Release Assets ($tagName)"
          }

      - name: Commit updated versions.json to repository
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (Test-Path versions.json) {
            $manifestContent = Get-Content -Raw versions.json
            git remote set-url origin "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git"
            git reset --hard HEAD
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            Set-Content -Path "versions.json" -Value $manifestContent -Encoding UTF8
            git add versions.json
            git diff --quiet --cached
            if ($LASTEXITCODE -ne 0) {
              git commit -m "chore(release): update versions.json manifest [skip ci]"
              git pull --rebase origin main
              git push origin main
            }
          }

