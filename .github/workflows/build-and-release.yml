name: Build and Release ChronoKeep

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release Binaries
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Core Daemon & Bridge DLL
        shell: pwsh
        run: |
          cargo build --manifest-path rust-workspace/Cargo.toml --release -p cr-service -p cr-bridge-dll

      - name: Update Embedded Binaries for Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rust-workspace/crates/cr-gui/embedded
          $binDir = if (Test-Path "rust-workspace/target/release/chrono-daemon.exe") { "rust-workspace/target/release" } else { "rust-workspace/target/x86_64-pc-windows-msvc/release" }
          Copy-Item -Force "$binDir/chrono-daemon.exe" rust-workspace/crates/cr-gui/embedded/
          Copy-Item -Force "$binDir/chronokeep.dll" rust-workspace/crates/cr-gui/embedded/
          if (Test-Path dist/chronokeep.ini) {
            Copy-Item -Force dist/chronokeep.ini rust-workspace/crates/cr-gui/embedded/
          }

      - name: Build All-In-One GUI Installer (ChronoKeepSetup.exe)
        shell: pwsh
        run: |
          cd rust-workspace
          cargo rustc --release -p cr-gui -- -C link-arg=crates/cr-gui/assets/app.res
          cd ..

      - name: Assemble Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          $binDir = if (Test-Path "rust-workspace/target/release/ChronoKeepSetup.exe") { "rust-workspace/target/release" } else { "rust-workspace/target/x86_64-pc-windows-msvc/release" }
          Copy-Item -Force "$binDir/ChronoKeepSetup.exe" release-artifacts/
          Copy-Item -Force "$binDir/chrono-daemon.exe" release-artifacts/
          Copy-Item -Force "$binDir/chronokeep.dll" release-artifacts/
          Copy-Item -Force "$binDir/chronokeep.dll" release-artifacts/cloud_redirect.dll
          if (Test-Path dist/chronokeep.ini) {
            Copy-Item -Force dist/chronokeep.ini release-artifacts/
          }
          if (Test-Path dist/Reparar_Instalacao_Steam.bat) {
            Copy-Item -Force dist/Reparar_Instalacao_Steam.bat release-artifacts/
          }
          if (Test-Path README.md) {
            Copy-Item -Force README.md release-artifacts/
          }
          if (Test-Path GUIA_GOOGLE_CLOUD_OAUTH.md) {
            Copy-Item -Force GUIA_GOOGLE_CLOUD_OAUTH.md release-artifacts/
          }
          # Cria o arquivo ZIP fora da pasta para evitar loop infinito de auto-inclusão
          Compress-Archive -Path release-artifacts/* -DestinationPath ChronoKeep-Windows-x64.zip -Force
          Get-ChildItem -Path release-artifacts
          Get-Item ChronoKeep-Windows-x64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChronoKeep-Windows-x64
          path: |
            release-artifacts/ChronoKeepSetup.exe
            ChronoKeep-Windows-x64.zip

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tagName = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "latest" }
          $relTitle = if ($env:GITHUB_REF -like "refs/tags/*") { "ChronoKeep $env:GITHUB_REF_NAME" } else { "ChronoKeep Latest Build" }
          
          # Cria a release se não existir ou atualiza os arquivos
          $exists = $true
          try {
            gh release view $tagName | Out-Null
          } catch {
            $exists = $false
          }
          
          if ($exists) {
            gh release upload $tagName release-artifacts/ChronoKeepSetup.exe ChronoKeep-Windows-x64.zip --clobber
          } else {
            gh release create $tagName release-artifacts/ChronoKeepSetup.exe ChronoKeep-Windows-x64.zip --title $relTitle --notes "ChronoKeep Release Assets"
          }
