name: Build and Release ChronoKeep

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-workspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Core Daemon & Bridge DLL
        shell: pwsh
        run: |
          cargo build --manifest-path rust-workspace/Cargo.toml --release --bin chrono-daemon -p cr-bridge-dll

      - name: Update Embedded Binaries for Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rust-workspace/crates/cr-gui/embedded
          Copy-Item -Force rust-workspace/target/release/chrono-daemon.exe rust-workspace/crates/cr-gui/embedded/
          Copy-Item -Force rust-workspace/target/release/chronokeep.dll rust-workspace/crates/cr-gui/embedded/
          if (Test-Path dist/chronokeep.ini) {
            Copy-Item -Force dist/chronokeep.ini rust-workspace/crates/cr-gui/embedded/
          }

      - name: Build All-In-One GUI Installer (ChronoKeepSetup.exe)
        shell: pwsh
        run: |
          cargo build --manifest-path rust-workspace/Cargo.toml --release -p cr-gui

      - name: Assemble Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Copy-Item -Force rust-workspace/target/release/ChronoKeepSetup.exe release-artifacts/
          Copy-Item -Force rust-workspace/target/release/chrono-daemon.exe release-artifacts/
          Copy-Item -Force rust-workspace/target/release/chronokeep.dll release-artifacts/
          Copy-Item -Force rust-workspace/target/release/chronokeep.dll release-artifacts/cloud_redirect.dll
          if (Test-Path dist/chronokeep.ini) {
            Copy-Item -Force dist/chronokeep.ini release-artifacts/
          }
          if (Test-Path dist/Reparar_Instalacao_Steam.bat) {
            Copy-Item -Force dist/Reparar_Instalacao_Steam.bat release-artifacts/
          }
          if (Test-Path README.md) {
            Copy-Item -Force README.md release-artifacts/
          }
          if (Test-Path GUIA_GOOGLE_CLOUD_OAUTH.md) {
            Copy-Item -Force GUIA_GOOGLE_CLOUD_OAUTH.md release-artifacts/
          }
          Compress-Archive -Path release-artifacts/* -DestinationPath release-artifacts/ChronoKeep-Windows-x64.zip -Force
          Get-ChildItem -Path release-artifacts

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChronoKeep-Windows-x64
          path: |
            release-artifacts/ChronoKeepSetup.exe
            release-artifacts/ChronoKeep-Windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/ChronoKeepSetup.exe
            release-artifacts/ChronoKeep-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true

